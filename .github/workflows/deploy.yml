name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Audit dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run audit:ci

      - name: Check types & code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check

      - name: Lint formatting and code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit

      - name: Cache Playwright browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright browsers
        id: browsers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install chromium || npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        id: e2e
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: |
          npm run test:e2e || {
            echo "::warning title=Playwright::Паралельний E2E-прогін зазнав збоїв під навантаженням. Перезапуск в один потік..."
            npx playwright test --last-failed --workers=1
          }

      - name: Upload Playwright report
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build site
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build
        env:
          BASE_PATH: /SeatWise

      - name: Check build artifacts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:build

      - name: Verify clean working directory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: git diff --exit-code

      - name: Upload Pages artifact
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
